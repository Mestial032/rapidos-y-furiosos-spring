spring.application.name=rapidosyfuriosos

# Puerto y nombre de la aplicacion (ruta base)
server.port=8089
server.servlet.context-path=/rapidosyfuriosos
server.servlet.session.tracking-modes=cookie

# Conexion a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bdrapidosyfuriosos20262?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (la BD ya existe, no se modifica su estructura)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Thymeleaf (vistas en src/main/resources/templates)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Mensajes de validacion (messages.properties)
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Las validaciones se aplican en los formularios (@Valid en los controladores web)
spring.jpa.properties.jakarta.persistence.validation.mode=none
