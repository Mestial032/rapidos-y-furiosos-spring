<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('Listar Estado Civil')}"></head>

<body>
  <nav th:replace="~{fragments/plantilla :: menu}"></nav>
  <div class="container">
    <div class="contenido shadow-sm p-4">
    <h1 class="titulo-pagina">Listado de Estados Civiles</h1>
    <div th:replace="~{fragments/plantilla :: alertas}"></div>
    <a th:href="@{/estadocivil/registro}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Registrar Estado Civil</a>
    <a th:href="@{/estadocivil/habilita}" class="btn btn-warning"><i class="bi bi-toggle-on"></i> Habilitar Estado Civil</a>
    <a th:href="@{/menuprincipal}" class="btn btn-dark">Regresar</a>
    <div class="mb-3"></div>
    <!-- inicio de la tabla -->
    <div class="table-responsive">
      <table class="table table-striped table-hover table-bordered">
        <thead class="table-dark">
          <tr>
            <th scope="col">Codigo</th>
            <th scope="col">Nombre</th>
            <th scope="col">Estado</th>
            <th scope="col" class="text-center">Actualizar</th>
            <th scope="col" class="text-center">Eliminar</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="estc : ${listaestadocivil}">
            <th scope="row" th:text="${estc.codigo}"></th>
            <td th:text="${estc.nombre}"></td>
            <td><span class="badge" th:classappend="${estc.estado} ? 'text-bg-success' : 'text-bg-secondary'"
                th:text="${estc.estado} ? 'Habilitado':'Deshabilitado'"></span></td>
            <td class="text-center"><a th:href="@{/estadocivil/actualiza/{id}(id=${estc.codigo})}" class="btn btn-success btn-sm">Seleccionar</a></td>
            <td class="text-center"><a th:href="@{/estadocivil/eliminar/{id}(id=${estc.codigo})}" class="btn btn-danger btn-sm"
                onclick="return confirm('¿Desea deshabilitar este registro?');">Seleccionar</a></td>
          </tr>
          <tr th:if="${#lists.isEmpty(listaestadocivil)}">
            <td colspan="5" class="text-center text-muted">No hay registros para mostrar</td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- fin de la tabla -->
    </div>
  </div>
  <th:block th:replace="~{fragments/plantilla :: scripts}"></th:block>
</body>

</html>
