<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Fragmentos reutilizables de Thymeleaf: cabecera, menu, mensajes y scripts -->

<head th:fragment="cabecera(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Rapidos y Furiosos | ' + ${titulo}">Rapidos y Furiosos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f1fb;
    }

    .contenido {
      background-color: white;
      border-radius: .5rem;
    }

    .titulo-pagina {
      color: #4a1fb8;
    }

    .table td,
    .table th {
      vertical-align: middle;
    }
  </style>
</head>

<body>

  <!-- inicio de la barra de menu -->
  <nav th:fragment="menu" class="navbar navbar-expand-lg bg-dark mb-4" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" th:href="@{/menuprincipal}"><i class="bi bi-car-front-fill"></i> Rapidos y Furiosos</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
        aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/menuprincipal}">Inicio</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Mantenimiento Simple
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/distrito/listar}">Distrito</a></li>
              <li><a class="dropdown-item" th:href="@{/sexo/listar}">Sexo</a></li>
              <li><a class="dropdown-item" th:href="@{/tipodocumento/listar}">Tipo de Documento</a></li>
              <li><a class="dropdown-item" th:href="@{/estadocivil/listar}">Estado Civil</a></li>
              <li><a class="dropdown-item" th:href="@{/marca/listar}">Marca</a></li>
              <li><a class="dropdown-item" th:href="@{/color/listar}">Color</a></li>
              <li><a class="dropdown-item" th:href="@{/rol/listar}">Rol</a></li>
              <li><a class="dropdown-item" th:href="@{/servicio/listar}">Servicio</a></li>
            </ul>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Mantenimiento Cruzado
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/cliente/listar}">Cliente</a></li>
              <li><a class="dropdown-item" th:href="@{/empleado/listar}">Empleado</a></li>
              <li><a class="dropdown-item" th:href="@{/vehiculo/listar}">Vehiculo</a></li>
            </ul>
          </li>
        </ul>
        <a class="btn btn-outline-light btn-sm" th:href="@{/}"><i class="bi bi-box-arrow-right"></i> Salir</a>
      </div>
    </div>
  </nav>
  <!-- fin de la barra de menu -->

  <!-- mensajes de exito y de error -->
  <div th:fragment="alertas">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="bi bi-check-circle-fill"></i> <span th:text="${mensaje}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
  </div>

  <th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </th:block>

</body>

</html>
