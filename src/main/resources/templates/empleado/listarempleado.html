<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('Listar Empleado')}"></head>

<body>
  <nav th:replace="~{fragments/plantilla :: menu}"></nav>
  <div class="container-fluid px-4">
    <div class="contenido shadow-sm p-4">
    <h1 class="titulo-pagina">Listado de Empleados</h1>
    <div th:replace="~{fragments/plantilla :: alertas}"></div>
    <a th:href="@{/empleado/registro}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Registrar Empleado</a>
    <a th:href="@{/empleado/habilita}" class="btn btn-warning"><i class="bi bi-toggle-on"></i> Habilitar Empleado</a>
    <a th:href="@{/menuprincipal}" class="btn btn-dark">Regresar</a>
    <div class="mb-3"></div>
    <!-- inicio de la tabla -->
    <div class="table-responsive">
      <table class="table table-striped table-hover table-bordered table-sm small">
        <thead class="table-dark">
          <tr>
            <th scope="col">Codigo</th>
            <th scope="col">Nombres</th>
            <th scope="col">T. Documento</th>
            <th scope="col">Num. Documento</th>
            <th scope="col">Fec. Nacimiento</th>
            <th scope="col">Sexo</th>
            <th scope="col">Estado Civil</th>
            <th scope="col">Direccion</th>
            <th scope="col">Distrito</th>
            <th scope="col">Telefono</th>
            <th scope="col">Celular</th>
            <th scope="col">Correo</th>
            <th scope="col">Usuario</th>
            <th scope="col">Rol</th>
            <th scope="col">Sueldo (S/)</th>
            <th scope="col">Estado</th>
            <th scope="col" class="text-center">Actualizar</th>
            <th scope="col" class="text-center">Eliminar</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="emp : ${listaempleado}">
            <th scope="row" th:text="${emp.codigo}"></th>
            <td th:text="${emp.nombre + ' ' + emp.apellidoPaterno + ' ' + emp.apellidoMaterno}"></td>
            <td th:text="${emp.tipoDocumento.nombre}"></td>
            <td th:text="${emp.numeroDocumento}"></td>
            <td th:text="${#temporals.format(emp.fechaNacimiento, 'dd/MM/yyyy')}"></td>
            <td th:text="${emp.sexo.nombre}"></td>
            <td th:text="${emp.estadoCivil.nombre}"></td>
            <td th:text="${emp.direccion}"></td>
            <td th:text="${emp.distrito.nombre}"></td>
            <td th:text="${emp.telefono}"></td>
            <td th:text="${emp.celular}"></td>
            <td th:text="${emp.correo}"></td>
            <td th:text="${emp.usuario}"></td>
            <td th:text="${emp.rol.nombre}"></td>
            <td th:text="${#numbers.formatDecimal(emp.sueldo, 1, 'COMMA', 2, 'POINT')}"></td>
            <td><span class="badge" th:classappend="${emp.estado} ? 'text-bg-success' : 'text-bg-secondary'"
                th:text="${emp.estado} ? 'Habilitado':'Deshabilitado'"></span></td>
            <td class="text-center"><a th:href="@{/empleado/actualiza/{id}(id=${emp.codigo})}" class="btn btn-success btn-sm">Seleccionar</a></td>
            <td class="text-center"><a th:href="@{/empleado/eliminar/{id}(id=${emp.codigo})}" class="btn btn-danger btn-sm"
                onclick="return confirm('¿Desea deshabilitar este registro?');">Seleccionar</a></td>
          </tr>
          <tr th:if="${#lists.isEmpty(listaempleado)}">
            <td colspan="18" class="text-center text-muted">No hay registros para mostrar</td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- fin de la tabla -->
    </div>
  </div>
  <th:block th:replace="~{fragments/plantilla :: scripts}"></th:block>
</body>

</html>
