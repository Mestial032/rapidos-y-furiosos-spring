<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('Actualizar Vehiculo')}"></head>

<body>
  <nav th:replace="~{fragments/plantilla :: menu}"></nav>
  <div class="container">
    <div class="contenido shadow-sm p-4 mb-4">
      <h1 class="titulo-pagina">Actualizacion de Vehiculo</h1>
      <div th:replace="~{fragments/plantilla :: alertas}"></div>
      <form th:action="@{/vehiculo/actualizar/{id}(id=*{codigo})}" method="post" th:object="${vehiculo}" novalidate>
        <div class="row">
        <div class="col-md-6 mb-3">
          <label for="codigo" class="form-label">Codigo:</label>
          <input type="text" id="codigo" class="form-control" th:field="*{codigo}" readonly>
        </div>
        <div class="col-md-6 mb-3">
          <label for="placa" class="form-label">Placa: <span class="text-danger">*</span></label>
          <input type="text" id="placa" class="form-control" th:field="*{placa}" th:errorclass="is-invalid"
            placeholder="Ingresa placa" maxlength="20" pattern="[A-Za-z0-9\-]{6,20}" style="text-transform: uppercase;" required>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('placa')}" th:errors="*{placa}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="marca" class="form-label">Marca: <span class="text-danger">*</span></label>
          <!-- el value es el codigo; Spring convierte el codigo en la entidad relacionada (clave foranea) -->
          <select id="marca" name="marca" class="form-select" th:classappend="${#fields.hasErrors('marca')} ? 'is-invalid'" required>
            <option value="">Seleccione marca</option>
            <option th:each="o : ${listamarca}" th:value="${o.codigo}" th:text="${o.nombre}"
              th:selected="${vehiculo.marca != null and vehiculo.marca.codigo == o.codigo}"></option>
          </select>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="modelo" class="form-label">Modelo: <span class="text-danger">*</span></label>
          <input type="text" id="modelo" class="form-control" th:field="*{modelo}" th:errorclass="is-invalid"
            placeholder="Ingresa modelo" maxlength="50" required>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="anio" class="form-label">Año: <span class="text-danger">*</span></label>
          <input type="number" id="anio" class="form-control" th:field="*{anio}" th:errorclass="is-invalid"
            placeholder="Ingresa año" min="1950" max="2027" step="1" required>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('anio')}" th:errors="*{anio}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="color" class="form-label">Color: <span class="text-danger">*</span></label>
          <!-- el value es el codigo; Spring convierte el codigo en la entidad relacionada (clave foranea) -->
          <select id="color" name="color" class="form-select" th:classappend="${#fields.hasErrors('color')} ? 'is-invalid'" required>
            <option value="">Seleccione color</option>
            <option th:each="o : ${listacolor}" th:value="${o.codigo}" th:text="${o.nombre}"
              th:selected="${vehiculo.color != null and vehiculo.color.codigo == o.codigo}"></option>
          </select>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('color')}" th:errors="*{color}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="cliente" class="form-label">Cliente (propietario): <span class="text-danger">*</span></label>
          <!-- el value es el codigo; Spring convierte el codigo en la entidad relacionada (clave foranea) -->
          <select id="cliente" name="cliente" class="form-select" th:classappend="${#fields.hasErrors('cliente')} ? 'is-invalid'" required>
            <option value="">Seleccione cliente (propietario)</option>
            <option th:each="o : ${listacliente}" th:value="${o.codigo}" th:text="${o.nombre + ' ' + o.apellidoPaterno + ' ' + o.apellidoMaterno + ' - ' + o.numeroDocumento}"
              th:selected="${vehiculo.cliente != null and vehiculo.cliente.codigo == o.codigo}"></option>
          </select>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="estado1" class="form-label">Estado:</label>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" th:field="*{estado}">
            <label class="form-check-label" for="estado1">Habilitado</label>
          </div>
        </div>
        </div>
        <p class="text-muted small"><span class="text-danger">*</span> Campos obligatorios</p>
        <button type="submit" class="btn btn-success"><i class="bi bi-pencil-square"></i> Actualizar</button>
        <a th:href="@{/vehiculo/listar}" class="btn btn-dark">Regresar</a>
      </form>
    </div>
  </div>
  <th:block th:replace="~{fragments/plantilla :: scripts}"></th:block>
</body>

</html>
