<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/plantilla :: cabecera('Actualizar Servicio')}"></head>

<body>
  <nav th:replace="~{fragments/plantilla :: menu}"></nav>
  <div class="container">
    <div class="contenido shadow-sm p-4">
      <h1 class="titulo-pagina">Actualizacion de Servicio</h1>
      <div th:replace="~{fragments/plantilla :: alertas}"></div>
      <form th:action="@{/servicio/actualizar/{id}(id=*{codigo})}" method="post" th:object="${servicio}" novalidate>
        <div class="row">
        <div class="col-md-6 mb-3">
          <label for="codigo" class="form-label">Codigo:</label>
          <input type="text" id="codigo" class="form-control" th:field="*{codigo}" readonly>
        </div>
        <div class="col-md-6 mb-3">
          <label for="nombre" class="form-label">Nombre: <span class="text-danger">*</span></label>
          <input type="text" id="nombre" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid"
            placeholder="Ingresa el nombre" maxlength="50" required>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="precio" class="form-label">Precio (S/): <span class="text-danger">*</span></label>
          <input type="number" id="precio" class="form-control" th:field="*{precio}" th:errorclass="is-invalid"
            placeholder="Ingresa el precio" step="0.01" min="0.01" required>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
        </div>
        <div class="col-12 mb-3">
          <label for="descripcion" class="form-label">Descripcion: <span class="text-danger">*</span></label>
          <textarea id="descripcion" class="form-control" th:field="*{descripcion}" th:errorclass="is-invalid"
            placeholder="Ingresa la descripcion del servicio" maxlength="300" rows="3" required></textarea>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="estado1" class="form-label">Estado:</label>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" th:field="*{estado}">
            <label class="form-check-label" for="estado1">Habilitado</label>
          </div>
        </div>
        </div>
        <p class="text-muted small"><span class="text-danger">*</span> Campos obligatorios</p>
        <button type="submit" class="btn btn-success"><i class="bi bi-pencil-square"></i> Actualizar</button>
        <a th:href="@{/servicio/listar}" class="btn btn-dark">Regresar</a>
      </form>
    </div>
  </div>
  <th:block th:replace="~{fragments/plantilla :: scripts}"></th:block>
</body>

</html>
